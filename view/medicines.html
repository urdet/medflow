<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFlow | Inventory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        
        /* Custom Modal Transition Classes */
        .modal-overlay { transition: opacity 0.3s ease-out; }
        .modal-container { transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-hidden .modal-container { transform: scale(0.95); opacity: 0; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex fixed h-full z-40 shadow-xl">
            <div class="p-6 flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i data-lucide="layout-dashboard" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-white font-bold text-xl tracking-tight">MedFlow</span>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Dashboard</span>
                </a>
                <a href="medicines.html" class="flex items-center gap-3 px-4 py-3 text-blue-400 bg-blue-600/10 border border-blue-600/20 rounded-xl">
                    <i data-lucide="pill" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Medicines</span>
                </a>
                <a href="suppliers.html" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Suppliers</span>
                </a>
                <a href="sales.html" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Sales</span>
                </a>
            </nav>
        </aside>
<!-- Main Content -->
        <main class="flex-1 md:ml-64 p-4 lg:p-10">
            <header class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
                <div>
                    <h1 class="text-3xl font-bold text-slate-900">Pharmacy Stock</h1>
                    <p class="text-slate-500 mt-1">Manage and track your pharmaceutical inventory.</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="Search by name..." 
                               class="pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:outline-none w-72 shadow-sm">
                    </div>
                    <button onclick="toggleModal(true)" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-700 transition-all flex items-center gap-2 shadow-lg shadow-blue-600/20">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Medicine
                    </button>
                </div>
            </header>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50/50 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Medicine & Category</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Unit Price</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest text-center">In Stock</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Expiration</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Supplier</th>
                                <th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="medicineTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                
                <div id="loadingState" class="p-20 text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-blue-600 mb-4"></div>
                    <p class="text-slate-400 text-sm font-medium">Fetching inventory...</p>
                </div>
                <div id="emptyState" class="hidden p-20 text-center">
                    <i data-lucide="package-x" class="w-12 h-12 text-slate-300 mx-auto mb-4"></i>
                    <h3 class="text-slate-900 font-bold">No Records Found</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Modal -->
    <div id="medicineModal" class="fixed inset-0 z-[60] flex items-center justify-center modal-hidden p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm modal-overlay" onclick="toggleModal(false)"></div>
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl relative z-10 modal-container overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex items-center justify-between">
                <h2 id="modalTitle" class="text-2xl font-bold text-slate-900">Add Medicine</h2>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-xl">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="medicineForm" class="p-8 space-y-5">
                <input type="hidden" id="medicineId">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Name</label>
                        <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Category</label>
                        <select id="category" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none">
                            <option value="Antibiotics">Antibiotics</option>
                            <option value="Analgesics">Analgesics</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Price (MAD)</label>
                        <input type="number" id="price" step="0.01" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Qty</label>
                        <input type="number" id="quantity" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Expiry</label>
                        <input type="date" id="expirationDate" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 py-3 font-semibold text-slate-600">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">Save</button>
                </div>
            </form>
        </div>
    </div>

<script>
    const API_URL = 'http://localhost:3000/api/medicines';
    let medicines = [];

    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        fetchData();
        
        // Attach search listener
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                renderTable(medicines.filter(m => 
                    m.name.toLowerCase().includes(term) ||
                    m.category.toLowerCase().includes(term) ||
                    (m.supplier_name && m.supplier_name.toLowerCase().includes(term))
                ));
            });
        }

        // Attach form listener
        const form = document.getElementById('medicineForm');
        if (form) {
            form.addEventListener('submit', handleFormSubmit);
        }
    });

    // Fetch all medicines from API
    async function fetchData() {
        const loading = document.getElementById('loadingState');
        const empty = document.getElementById('emptyState');
        const tbody = document.getElementById('medicineTableBody');
        
        if (loading) loading.classList.remove('hidden');
        if (empty) empty.classList.add('hidden');
        if (tbody) tbody.innerHTML = '';
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            medicines = await response.json();
            
            // Hide loading state
            if (loading) loading.classList.add('hidden');
            
            // Show empty state if no data
            if (medicines.length === 0) {
                if (empty) empty.classList.remove('hidden');
                return;
            }
            
            renderTable(medicines);
        } catch (err) {
            console.error("Fetch error:", err);
            if (loading) loading.classList.add('hidden');
            
            // Fallback to mock data for demo purposes
            console.log("Using fallback mock data...");
            medicines = [
                { id: 1, name: 'Amoxicillin', category: 'Antibiotics', price: 12.50, quantity: 45, expiration_date: '2026-05-12', supplier_name: 'PharmaCorp' },
                { id: 2, name: 'Paracetamol', category: 'Analgesics', price: 5.20, quantity: 8, expiration_date: '2025-02-10', supplier_name: 'Global Meds' }
            ];
            renderTable(medicines);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('medicineTableBody');
        const empty = document.getElementById('emptyState');
        if (!tbody) return;
        
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            if (empty) empty.classList.remove('hidden');
            return;
        }
        
        if (empty) empty.classList.add('hidden');

        data.forEach(m => {
            // Calculate days until expiration
            const expDate = new Date(m.expiration_date);
            const today = new Date();
            const daysUntilExpiry = Math.floor((expDate - today) / (1000 * 3600 * 24));
            
            // Determine status classes
            let statusClass = 'text-slate-600';
            let statusIcon = '';
            
            if (daysUntilExpiry < 0) {
                statusClass = 'text-red-600 font-bold';
                statusIcon = '<i data-lucide="alert-circle" class="w-4 h-4 inline mr-1"></i>';
            } else if (daysUntilExpiry < 30) {
                statusClass = 'text-orange-500 font-semibold';
                statusIcon = '<i data-lucide="alert-triangle" class="w-4 h-4 inline mr-1"></i>';
            } else if (daysUntilExpiry < 90) {
                statusClass = 'text-yellow-500';
            }
            
            // Format date
            const formattedDate = expDate.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            tbody.innerHTML += `
                <tr class="group hover:bg-slate-50 transition-all">
                    <td class="px-6 py-5">
                        <p class="font-bold text-slate-900">${m.name}</p>
                        <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">${m.category}</p>
                    </td>
                    <td class="px-6 py-5">
                        <span class="text-sm font-semibold">${parseFloat(m.price).toFixed(2)} MAD</span>
                    </td>
                    <td class="px-6 py-5 text-center">
                        <span class="px-3 py-1 rounded-lg ${m.quantity < 10 ? 'bg-red-100 text-red-700' : 'bg-slate-100'} text-sm font-bold">
                            ${m.quantity}
                        </span>
                    </td>
                    <td class="px-6 py-5">
                        <span class="text-sm ${statusClass}">
                            ${statusIcon}${formattedDate}
                            ${daysUntilExpiry < 30 && daysUntilExpiry >= 0 ? `<span class="text-xs ml-1">(${daysUntilExpiry} days)</span>` : ''}
                        </span>
                    </td>
                    <td class="px-6 py-5 text-sm text-slate-500">
                        ${m.supplier_name || 'N/A'}
                    </td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="openEdit(${m.id})" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="handleDelete(${m.id})" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors ml-1" title="Delete">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        
        lucide.createIcons();
    }

    function toggleModal(show) {
        const modal = document.getElementById('medicineModal');
        if (!modal) return;
        
        if (show) {
            modal.classList.remove('modal-hidden');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        } else {
            modal.classList.add('modal-hidden');
            document.body.style.overflow = 'auto'; // Restore scrolling
            document.getElementById('medicineForm')?.reset();
            document.getElementById('medicineId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Medicine';
        }
    }

    async function openEdit(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            if (!response.ok) throw new Error('Failed to fetch medicine');
            
            const med = await response.json();
            
            document.getElementById('modalTitle').innerText = 'Edit Medicine';
            document.getElementById('medicineId').value = med.id;
            document.getElementById('name').value = med.name;
            document.getElementById('category').value = med.category;
            document.getElementById('price').value = med.price;
            document.getElementById('quantity').value = med.quantity;
            document.getElementById('expirationDate').value = med.expiration_date;
            
            toggleModal(true);
        } catch (err) {
            console.error("Edit error:", err);
            alert('Failed to load medicine data');
        }
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        
        const id = document.getElementById('medicineId').value;
        const isEdit = !!id;
        
        const medicineData = {
            name: document.getElementById('name').value,
            category: document.getElementById('category').value,
            price: parseFloat(document.getElementById('price').value),
            quantity: parseInt(document.getElementById('quantity').value),
            expiration_date: document.getElementById('expirationDate').value,
            supplier_id: 1 // Default supplier - you might want to make this dynamic
        };
        
        try {
            const url = isEdit ? `${API_URL}/${id}` : API_URL;
            const method = isEdit ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(medicineData)
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to save medicine');
            }
            
            toggleModal(false);
            fetchData(); // Refresh the table
            
            // Show success message
            showToast(isEdit ? 'Medicine updated successfully!' : 'Medicine added successfully!', 'success');
            
        } catch (err) {
            console.error("Save error:", err);
            showToast(err.message || 'Failed to save medicine', 'error');
        }
    }

    async function handleDelete(id) {
        if (!confirm('Are you sure you want to delete this medicine? This action cannot be undone.')) {
            return;
        }
        
        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to delete medicine');
            }
            
            // Remove from local array
            medicines = medicines.filter(m => m.id !== id);
            
            // Re-render table
            renderTable(medicines);
            
            // Show success message
            showToast('Medicine deleted successfully!', 'success');
            
        } catch (err) {
            console.error("Delete error:", err);
            showToast(err.message || 'Failed to delete medicine', 'error');
        }
    }

    // Toast notification function
    function showToast(message, type = 'info') {
        // Remove existing toast
        const existingToast = document.querySelector('.custom-toast');
        if (existingToast) existingToast.remove();
        
        const colors = {
            success: 'bg-green-500',
            error: 'bg-red-500',
            info: 'bg-blue-500'
        };
        
        const toast = document.createElement('div');
        toast.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-lg z-50 custom-toast animate-slideIn`;
        toast.innerHTML = `
            <div class="flex items-center gap-3">
                <i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info'}" class="w-5 h-5"></i>
                <span class="font-medium">${message}</span>
            </div>
        `;
        
        document.body.appendChild(toast);
        lucide.createIcons();
        
        // Auto-remove after 3 seconds
        setTimeout(() => {
            toast.classList.remove('animate-slideIn');
            toast.classList.add('animate-slideOut');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
        
        // Add CSS animations
        if (!document.querySelector('#toast-styles')) {
            const style = document.createElement('style');
            style.id = 'toast-styles';
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                .animate-slideIn { animation: slideIn 0.3s ease-out; }
                .animate-slideOut { animation: slideOut 0.3s ease-out; }
            `;
            document.head.appendChild(style);
        }
    }

    // Export data function (optional)
    function exportToCSV() {
        const headers = ['Name', 'Category', 'Price', 'Quantity', 'Expiration Date', 'Supplier'];
        const rows = medicines.map(m => [
            m.name,
            m.category,
            m.price,
            m.quantity,
            m.expiration_date,
            m.supplier_name || 'N/A'
        ]);
        
        const csvContent = [
            headers.join(','),
            ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
        ].join('\n');
        
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `medicines_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFlow | Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body class="text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex fixed h-full z-40 shadow-xl">
            <div class="p-6 flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i data-lucide="layout-dashboard" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-white font-bold text-xl tracking-tight">MedFlow</span>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-blue-400 bg-blue-600/10 border border-blue-600/20 rounded-xl">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Dashboard</span>
                </a>
                <a href="medicines.html" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="pill" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Medicines</span>
                </a>
                <a href="suppliers.html" class=" flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Suppliers</span>
                </a>
                <a href="sales.html" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">Sales</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 md:ml-64 p-4 lg:p-8">
            <!-- Header -->
            <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Health Overview</h1>
                    <p class="text-slate-500 text-sm">Real-time statistics for your pharmacy branch.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="fetchAllData()" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors shadow-sm">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        Sync Data
                    </button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                        + New Sale
                    </button>
                </div>
            </header>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Card 1 -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="bg-blue-50 p-2 rounded-lg text-blue-600">
                            <i data-lucide="package" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">+2.4%</span>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">Total Medicines</p>
                    <h3 id="card-medicines" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <!-- Card 2 -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="bg-purple-50 p-2 rounded-lg text-purple-600">
                            <i data-lucide="truck" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">Suppliers</p>
                    <h3 id="card-suppliers" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <!-- Card 3 -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="bg-emerald-50 p-2 rounded-lg text-emerald-600">
                            <i data-lucide="trending-up" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">Weekly</span>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">Sales Count</p>
                    <h3 id="card-sales" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <!-- Card 4 -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="bg-amber-50 p-2 rounded-lg text-amber-600">
                            <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">Revenue</p>
                    <h3 id="card-revenue" class="text-2xl font-bold mt-1">--</h3>
                </div>
            </div>

            <!-- Charts and Tables -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Bar Chart Section -->
                <div class="lg:col-span-2 glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="font-bold text-lg">Top Performing Medicines</h2>
                        <select class="text-sm border-none bg-slate-100 rounded-md px-2 py-1 focus:ring-0">
                            <option>Last 30 Days</option>
                            <option>Last 7 Days</option>
                        </select>
                    </div>
                    <div class="h-80 w-full">
                        <canvas id="topSalesChart"></canvas>
                    </div>
                </div>

                <!-- Expiring List -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="font-bold text-lg">Inventory Alerts</h2>
                        <i data-lucide="bell" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <div class="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2" id="expiring-list">
                        <!-- Items will be injected here -->
                        <div class="animate-pulse flex space-x-4">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                                <div class="h-4 bg-slate-200 rounded"></div>
                            </div>
                        </div>
                    </div>
                    <button class="w-full mt-6 py-2 text-sm font-semibold text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                        View Full Inventory
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:3000/api';
        let topSalesChart;

        // Initialize Lucide Icons
        lucide.createIcons();

        // On Load
        window.addEventListener('load', () => {
            fetchAllData();
        });

        async function fetchAllData() {
            try {
                
                const stats = await (await fetch(`${API_BASE_URL}/stats/overview`)).json();
                // overview data structure : total_medicines, total_suppliers, total_sales, total_revenue
                const topSales = await (await fetch(`${API_BASE_URL}/stats/top-sales`)).json();
                // topSales data structure : medicine_name, total_sold
                const expiring = await (await fetch(`${API_BASE_URL}/stats/expiring`)).json();
                // expiring data structure : medicine_name, expiration_date

                console.log({stats, topSales, expiring});
                updateUI(stats, topSales, expiring);
            } catch (err) {
                console.error("Fetch failed", err);
            }
        }

        function updateUI(stats, topSales, expiring) {
            // Update Cards
            document.getElementById('card-medicines').innerText = stats.total_medicines;
            document.getElementById('card-suppliers').innerText = stats.total_suppliers;
            document.getElementById('card-sales').innerText = stats.total_sales;
            document.getElementById('card-revenue').innerText = `MAD ${stats.total_revenue}`;

            // Render Chart
            const ctx = document.getElementById('topSalesChart').getContext('2d');
            if (topSalesChart) topSalesChart.destroy();
            
            topSalesChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: topSales.map(d => d.medicine_name),
                    datasets: [{
                        label: 'Units Sold',
                        data: topSales.map(d => d.total_sold),
                        backgroundColor: '#2563eb', // Blue-600
                        hoverBackgroundColor: '#1d4ed8',
                        borderRadius: 8,
                        barThickness: 32
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            padding: 12,
                            titleFont: { size: 14, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            border: { display: false }
                        },
                        x: { 
                            grid: { display: false },
                            border: { display: false }
                        }
                    }
                }
            });

            // Populate Expiring List
            const listContainer = document.getElementById('expiring-list');
            listContainer.innerHTML = '';
            
            expiring.forEach(item => {
                const date = new Date(item.expiration_date);
                const isCritical = (date - new Date()) / (1000 * 60 * 60 * 24) < 60; // Less than 60 days

                listContainer.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl ${isCritical ? 'bg-red-50' : 'bg-slate-50'} border border-transparent hover:border-slate-200 transition-all">
                        <div class="flex items-center gap-3">
                            <div class="${isCritical ? 'text-red-500 bg-red-100' : 'text-slate-400 bg-slate-200'} p-2 rounded-lg">
                                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-sm font-semibold">${item.medicine_name}</p>
                                <p class="text-xs text-slate-500">Exp: ${date.toLocaleDateString()}</p>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-wider ${isCritical ? 'text-red-600' : 'text-slate-500'}">
                            ${isCritical ? 'Critical' : 'Watch'}
                        </span>
                    </div>
                `;
            });
            lucide.createIcons(); // Refresh icons for new elements
        }
    </script>
</body>
</html>
